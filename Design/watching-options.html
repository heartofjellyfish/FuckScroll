<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>鸭子的状态与列表 · 交互对照</title>
<style>*{box-sizing:border-box}body{margin:24px auto;padding:0 16px;max-width:840px;background:#fdf6e6;color:#1a1917;font:16px system-ui}main{display:flex;flex-wrap:wrap;gap:36px}article{width:min(100%,350px)}button,select{font:inherit;border:2px solid;background:#fdf6e6;border-radius:6px;padding:7px;cursor:pointer}section{margin-top:12px;height:490px;padding:18px;border:3px solid;border-radius:28px;display:flex;flex-direction:column;gap:12px;overflow:hidden}h2,h3,strong{font-family:'Avenir Next Condensed',sans-serif;font-weight:900;margin:0}strong{font-size:38px;line-height:1}img{width:100%;height:200px;object-fit:contain;flex:1;min-height:0}.row{border-bottom:2px solid;padding:14px 0;display:flex;justify-content:space-between;align-items:center}.scroll{flex:1;overflow:auto}.dot{color:#387644}footer{display:flex;justify-content:space-between}.black{background:#191817;color:white}p{font-size:14px}</style>
<main><article><h2>首页状态</h2><select id=s><option>A · 静态绿点</option><option>B · 眼睛</option><option>C · 图标旁的指示灯</option></select> <button id=t>切换开关</button><section><footer><b id=lamp></b>⚙</footer><strong>OH, GOOD.<br>ANOTHER REEL.</strong><img src="../ScrollStopper/Resources/Assets.xcassets/ComicChill.imageset/duck-v2.png"><button id=icons></button></section></article><article><h2>Your limits 滚动</h2><select id=l><option>A · 固定保存，内容滚动</option><option>B · 列表进入详情</option><option>C · 只滚 App 列表</option></select><section><h3>YOUR LIMITS.</h3><div class=scroll id=list></div><div id=breakrow></div><button class=black>Save changes</button></section></article></main>
<script>let on=true;function state(){lamp.innerHTML=s.selectedIndex===2?'':s.selectedIndex===1?(on?'◉ ◉':'– –'):(on?'<span class=dot>●</span>':'Ⅱ');icons.innerHTML=(s.selectedIndex===2?(on?'<span class=dot>●</span> ':'Ⅱ '):'')+'rednote · Instagram · Discord　›'}s.onchange=state;t.onclick=()=>{on=!on;state()};state();let apps=['rednote','Instagram','Discord','Drums','GarageBand','YouTube','TikTok','Safari','Games'];function rows(){let mode=l.selectedIndex;list.innerHTML='';breakrow.innerHTML=mode===2?'Break　15 min':'';apps.forEach(n=>{let r=document.createElement('div');r.className='row';r.innerHTML=n+'<button>20 min　›</button>';r.onclick=()=>{if(mode===1){list.innerHTML='<button id=back>‹ Back</button><h2>'+n+'</h2><p>10 min　20 min　30 min</p>';back.onclick=rows}else{let q=r.querySelector('small');if(q)q.remove();else r.insertAdjacentHTML('beforeend','<small>10 / 20 / 30</small>')}};list.append(r)});if(mode!==2)list.insertAdjacentHTML('beforeend','<p>Break　15 min</p>')}l.onchange=rows;rows()</script>
